{{define "content"}}
<h1>{{.Title}}</h1>
<form id="add-transaction" class="transaction-form">
  <div class="form-header">
    <h2>Add Transaction</h2>
    <p>Record your income or expenses.</p>
  </div>

  <div class="form-group">
    <label for="name">Transaction Name</label>
    <input id="name" name="name" type="text" required placeholder="e.g. Grocery shopping">
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="type">Type</label>
      <select id="type" name="type" required>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <div class="amount-input">
        <span>Rp</span>
        <input id="amount" name="amount" type="number" min="0" required placeholder="0">
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="category">Category</label>
    <select id="category" name="category" required>
      <option value="uncategorized">Uncategorized</option>
      <option value="salary">Salary</option>
      <option value="interest">Interest</option>
      <option value="dividend">Dividend</option>
      <option value="profit">Profit</option>
      <option value="food">Food</option>
      <option value="house">House</option>
      <option value="bill">Bill</option>
      <option value="entertainment">Entertainment</option>
    </select>
  </div>

  <div class="form-group">
    <label for="desc">Description</label>
    <textarea id="desc" name="desc" required placeholder="Add a note about this transaction..." rows="4"></textarea>
  </div>

  <button type="submit" class="submit-btn">
    <span>+</span>
    Add Transaction
  </button>
  <span id="msg"></span>
</form>

<link rel="stylesheet" href="/static/css/dashboard.css">

<script>
  const form = document.getElementById("add-transaction");
  const msg = document.getElementById("msg");
  form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const msg = document.getElementById("msg");
      try {
        const res = await fetch("/api/transaction", {
          method: "POST",
          body: new FormData(form),
        })

        const data = await res.json();
        if (res.ok) {
          msg.textContent = "Transaction created";
          form.reset();
        } else {
          msg.textContent = "Failed to create transaction"
        }
      } catch (err) {
        msg.textContent = "Server Unavailable"
        console.log(err)
      }
    })
</script>
{{end}}
